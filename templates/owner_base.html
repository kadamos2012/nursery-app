<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}لوحة المالكة{% endblock %}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #F4F7F1; margin: 0; padding-bottom: 40px; color: #1F2A22; }
    header { background: #2F5D50; color: white; padding: 16px; }
    header h1 { font-family: 'Cairo', sans-serif; font-size: 17px; margin: 0 0 12px; }
    nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    nav a {
      color: white; text-decoration: none; font-size: 12.5px; padding: 7px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.12); white-space: nowrap; flex-shrink: 0;
    }
    nav a.active { background: white; color: #2F5D50; font-weight: 700; }
    main { padding: 16px; }
    .card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(47,93,80,0.06); margin-bottom: 14px; }
    .card h2 { font-size: 14px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 9px 6px; border-bottom: 1px solid #E4E9E1; }
    th { color: #5B6B5E; font-weight: 700; font-size: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { background: #DCEAE3; border-radius: 14px; padding: 12px; }
    .stat.expense { background: #F8DFD9; }
    .stat.honey { background: #FBEBCB; }
    .stat .label { font-size: 11px; color: #5B6B5E; }
    .stat .value { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 18px; margin-top: 4px; }
    form.inline { display: flex; flex-direction: column; gap: 10px; }
    input, select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #E4E9E1; border-radius: 10px;
      font-family: 'Tajawal', sans-serif; font-size: 13.5px;
    }
    button.primary {
      padding: 12px; background: #2F5D50; color: white; border: none; border-radius: 10px;
      font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 13.5px; cursor: pointer;
    }
    .badge { font-size: 10.5px; padding: 4px 9px; border-radius: 20px; font-weight: 700; }
    .badge.paid { background: #DCEAE3; color: #2F5D50; }
    .badge.due { background: #FBEBCB; color: #946515; }
    a.row-link { color: #2F5D50; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>{% block header_title %}لوحة المالكة{% endblock %}</h1>
    <nav>
      <a href="{{ url_for('owner_dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">نظرة عامة</a>
      <a href="{{ url_for('owner_classes') }}" class="{{ 'active' if active == 'classes' }}">الفصول والطلبة</a>
      <a href="{{ url_for('owner_parents') }}" class="{{ 'active' if active == 'parents' }}">أولياء الأمور</a>
      <a href="{{ url_for('owner_birthdays') }}" class="{{ 'active' if active == 'birthdays' }}">أعياد الميلاد</a>
      <a href="{{ url_for('owner_announcements') }}" class="{{ 'active' if active == 'announcements' }}">الإعلانات</a>
      <a href="{{ url_for('owner_trips') }}" class="{{ 'active' if active == 'trips' }}">الرحلات</a>
      <a href="{{ url_for('owner_settings') }}" class="{{ 'active' if active == 'settings' }}">الإعدادات</a>
      <a href="{{ url_for('owner_addons') }}" class="{{ 'active' if active == 'addons' }}">الاشتراكات الإضافية</a>
      <a href="{{ url_for('owner_tuition') }}" class="{{ 'active' if active == 'tuition' }}">تحصيل المصروفات</a>
      <a href="{{ url_for('owner_dues') }}" class="{{ 'active' if active == 'dues' }}">المتأخرين</a>
      <a href="{{ url_for('owner_payment_methods') }}" class="{{ 'active' if active == 'methods' }}">طرق التحصيل والصرف</a>
      <a href="{{ url_for('owner_activities') }}" class="{{ 'active' if active == 'activities' }}">الأنشطة</a>
      <a href="{{ url_for('owner_staff') }}" class="{{ 'active' if active == 'staff' }}">الموظفين</a>
      <a href="{{ url_for('owner_expenses') }}" class="{{ 'active' if active == 'expenses' }}">المصروفات</a>
      <a href="{{ url_for('owner_reports') }}" class="{{ 'active' if active == 'reports' }}">التقارير</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

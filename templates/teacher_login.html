<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المعلمة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif; background: #F4F7F1; margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;
    }
    .card {
      background: white; border-radius: 20px; padding: 28px 22px; width: 100%; max-width: 360px;
      box-shadow: 0 4px 20px rgba(47,93,80,0.08);
    }
    h1 { font-size: 18px; color: #1F2A22; margin: 0 0 4px; }
    p.sub { font-size: 13px; color: #5B6B5E; margin: 0 0 20px; }
    label { font-size: 13px; color: #1F2A22; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #E4E9E1; border-radius: 12px;
      font-family: 'Tajawal', sans-serif; font-size: 14px; margin-bottom: 16px;
    }
    button {
      width: 100%; padding: 13px; background: #2F5D50; color: white; border: none;
      border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .error { background: #F8DFD9; color: #B23A22; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>تسجيل دخول المعلمة</h1>
    <p class="sub">حضانة البراعم الصغيرة</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>رقم الهاتف</label>
      <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>
      <label>كلمة المرور</label>
      <input type="password" name="password" required>
      <button type="submit">دخول</button>
    </form>
  </div>
</body>
</html>

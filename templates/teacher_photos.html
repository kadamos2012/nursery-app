<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صور الفصل</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #F4F7F1; margin: 0; padding-bottom: 40px; }
    header { background: #2F5D50; color: white; padding: 16px; display: flex; align-items: center; gap: 10px; }
    header a { color: white; text-decoration: none; font-size: 18px; }
    header h1 { font-family: 'Cairo', sans-serif; font-size: 16px; margin: 0; }
    .card { background: white; border-radius: 16px; padding: 14px 16px; margin: 16px; box-shadow: 0 2px 10px rgba(47,93,80,0.06); }
    input, textarea { width: 100%; padding: 11px 13px; border: 1px solid #E4E9E1; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 13.5px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background: #2F5D50; color: white; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 13.5px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
    .photo { border-radius: 12px; overflow: hidden; background: white; box-shadow: 0 2px 10px rgba(47,93,80,0.06); }
    .photo img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .photo .cap { font-size: 11px; padding: 6px 8px; color: #5B6B5E; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('teacher_dashboard') }}">→</a>
    <h1>صور الفصل</h1>
  </header>

  <div class="card">
    {% if classes|length > 1 %}
    <form method="GET" style="margin-bottom: 12px;">
      <select name="class_id" onchange="this.form.submit()" style="width:100%; padding:10px; border-radius:10px; border:1px solid #E4E9E1; font-family:'Tajawal',sans-serif;">
        {% for c in classes %}
          <option value="{{ c.id }}" {{ 'selected' if c.id == selected_class_id }}>فصل {{ c.name }}</option>
        {% endfor %}
      </select>
    </form>
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="class_id" value="{{ selected_class_id }}">
      <input type="file" name="photo" accept="image/*" required>
      <textarea name="caption" rows="2" placeholder="وصف الصورة (اختياري)"></textarea>
      <button type="submit">رفع الصورة</button>
    </form>
  </div>

  <div class="grid">
    {% for p in photos %}
    <div class="photo">
      <img src="{{ url_for('serve_class_photo', photo_id=p.id) }}">
      {% if p.caption %}<div class="cap">{{ p.caption }}</div>{% endif %}
    </div>
    {% endfor %}
  </div>
</body>
</html>
